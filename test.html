<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">Россия сквозь века - Интерактивные тесты по истории</title>
    <link rel="stylesheet" href="./css/testStyle.css">
</head>
<body>
    <header id="header">
        <div class="header-content">
            <h1 class="title">Россия сквозь века</h1>
            <h2 class="sub-title">Интерактивные тесты по истории России</h2>
        </div>
    </header>

    <main>
        <section class="timer" id="timer" style="display: none;">
            <div class="timer-item timer-minutes">10</div>
            <div class="separator">:</div>
            <div class="timer-item timer-seconds">00</div>
        </section>
        <section>
            <div class="questionnare">
                <button onclick="goToMainPage()" class="test-button">← К выбору темы</button>
                <span id="questions-list"></span>
                <span id="question"></span>
                <fieldset>
                    <span id="answers">
                    </span>
                </fieldset>
                <p id="description"></p>
            </div>
        </section>
    </main>
    <div id="resultsModal" class="modal" style="display: none;">
  <div class="modal-content">
    <h2>Тест завершён!</h2>
    <div class="final-score">Твой результат: <span id="finalScore"></span></div>
    <div class="actions">
      <button onclick="restartQuiz()" class="test-button">↻ Пройти заново</button>
      <button onclick="goToMainPage()" class="test-button">← К выбору темы</button>
    </div>
  </div>
</div>
    <script defer type="module" src="js/testScript.js"></script>
</body>
</html>
